<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Creator Dashboard | FLEXIST</title>
  
  <!-- SEO & Privacy Guards -->
  <meta name="robots" content="noindex, nofollow">
  
  <!-- Stylesheets -->
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/animations.css">
  <link rel="stylesheet" href="../css/mobile-fixes.css">
  <link rel="stylesheet" href="./css/influencer.css">
</head>
<body data-page="influencer">
  <div data-site-nav></div>
  
  <main id="main-content" class="influencer-main">
    <div class="container">
    <!-- Dashboard Header -->
    <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.08); padding-bottom: 24px; margin-bottom: 32px; flex-wrap: wrap; gap: 16px;">
      <div>
        <p class="page-kicker" style="margin: 0;">FLEXIST CREATOR HUB</p>
        <h1 style="font-family: var(--font-display); font-size: clamp(1.8rem, 4vw, 2.5rem); margin: 8px 0 0 0;">Welcome, Creator</h1>
      </div>
      <button id="logout-btn" class="ghost-button" style="padding: 8px 16px; font-size: 13px;">Logout</button>
    </div>

    <!-- Main Dashboard Grid -->
    <div class="dashboard-grid">
      
      <!-- Left Sidebar: Creator Profile Card -->
      <aside>
        <div class="creator-profile-card">
          <div id="profile-avatar" class="profile-avatar">C</div>
          
          <h2 id="profile-name" style="font-family: var(--font-display); font-size: 20px; margin: 0 0 4px 0;">Loading...</h2>
          <p id="profile-email" style="color: var(--text-secondary); font-size: 13px; margin: 0 0 16px 0; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 12px; word-break: break-all;">Loading...</p>
          
          <div class="creator-info-item">
            <small>Channel / Account</small>
            <span id="profile-platform" style="font-weight: 500;">Loading...</span>
          </div>

          <div class="creator-info-item">
            <small>Status</small>
            <span class="badge-approved" style="margin-top: 4px;">Approved ✓</span>
          </div>

          <div class="creator-info-item" style="border-top: 1px solid rgba(255,255,255,0.05); margin-top: 20px; padding-top: 16px;">
            <small>Total Earnings</small>
            <div id="total-earned-amount" class="earnings-total">₹0</div>
          </div>
        </div>
      </aside>

      <!-- Right Panel: Campaigns & Payments -->
      <section style="display: flex; flex-direction: column; gap: 48px;">
        
        <!-- Active Campaigns -->
        <div>
          <h2 style="font-family: var(--font-display); font-size: 22px; margin: 0 0 20px 0; display: flex; align-items: center; gap: 8px;">
            <span>📋</span> Active Campaigns
          </h2>
          <div id="active-campaigns-container" class="campaign-grid">
            <!-- Loaded dynamically by creator.js -->
            <div style="padding: 20px; text-align: center; color: var(--text-secondary);">Loading campaigns...</div>
          </div>
        </div>

        <!-- Earnings History -->
        <div>
          <h2 style="font-family: var(--font-display); font-size: 22px; margin: 0 0 20px 0; display: flex; align-items: center; gap: 8px;">
            <span>💰</span> Payout History
          </h2>
          
          <div class="admin-table-container">
            <table class="admin-table">
              <thead>
                <tr>
                  <th>Project</th>
                  <th>Task</th>
                  <th>Amount</th>
                  <th>Paid On</th>
                </tr>
              </thead>
              <tbody id="earnings-table-body">
                <!-- Loaded dynamically by creator.js -->
                <tr>
                  <td colspan="4" style="text-align: center; color: var(--text-secondary); padding: 24px;">Loading payout history...</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>

      </section>
    </div>
  </div>
</main>

  <div data-site-footer></div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/global.js"></script><script src="../js/fx.js"></script>
  <script src="./js/auth.js"></script>
  <script src="./js/creator.js"></script>
</body>
</html>
