<svg xmlns="http://www.w3.org/2000/svg" width="220" height="220" viewBox="0 0 220 220">
  <!-- Monochrome film grain. Use as a fixed, pointer-events:none overlay at
       opacity .03–.05 over the page ground. It is the cheapest way to stop a
       large flat dark surface reading as a template. Tile it; do not scale it. -->
  <filter id="g">
    <feTurbulence type="fractalNoise" baseFrequency="0.82" numOctaves="3" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
  </filter>
  <rect width="220" height="220" filter="url(#g)" opacity="0.55"/>
</svg>
