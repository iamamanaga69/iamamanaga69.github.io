<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Flexist">
  <defs>
    <linearGradient id="fxBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1A33"/>
      <stop offset="1" stop-color="#04070E"/>
    </linearGradient>
    <linearGradient id="fxGrowth" x1="0.14" y1="0.86" x2="0.86" y2="0.14">
      <stop offset="0" stop-color="#00d4ff"/>
      <stop offset="0.55" stop-color="#12e0c8"/>
      <stop offset="1" stop-color="#00ff88"/>
    </linearGradient>
    <radialGradient id="fxHalo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#0066ff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#0066ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="fxSoft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="fxTip" x="-140%" y="-140%" width="380%" height="380%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="512" height="512" rx="116" fill="url(#fxBg)"/>
  <circle cx="300" cy="205" r="215" fill="url(#fxHalo)"/>

  <!-- growth path: soft glow underlay + crisp stroke -->
  <path d="M152 358 L256 278 L382 158" stroke="url(#fxGrowth)" stroke-width="34" stroke-linecap="round" stroke-linejoin="round" opacity="0.45" filter="url(#fxSoft)"/>
  <path d="M152 358 L256 278 L382 158" stroke="url(#fxGrowth)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- reach arc at the peak (signal / amplification) -->
  <circle cx="382" cy="158" r="58" stroke="#00ff88" stroke-width="5" opacity="0.22" fill="none"/>

  <!-- nodes -->
  <circle cx="152" cy="358" r="18" fill="#0A1424" stroke="#00d4ff" stroke-width="9"/>
  <circle cx="256" cy="278" r="18" fill="#0A1424" stroke="#12e0c8" stroke-width="9"/>

  <!-- peak node with glow -->
  <circle cx="382" cy="158" r="38" fill="#00ff88" opacity="0.85" filter="url(#fxTip)"/>
  <circle cx="382" cy="158" r="29" fill="#EAFFF3" stroke="#00ff88" stroke-width="9"/>
</svg>
