<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Creator Login | FLEXIST</title>
  
  <!-- SEO & Privacy Guards -->
  <meta name="robots" content="noindex, nofollow">
  
  <!-- Stylesheets -->
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/animations.css">
  <link rel="stylesheet" href="../css/mobile-fixes.css">
  <link rel="stylesheet" href="./css/influencer.css">
</head>
<body data-page="influencer">
  <div data-site-nav></div>
  
  <main id="main-content" class="influencer-main" style="min-height: 70vh; display: flex; align-items: center; justify-content: center; box-sizing: border-box;">
    <div class="auth-container" style="width: 100%; margin: 0;">
      <div class="auth-header">
        <div style="font-size: 2.5rem; margin-bottom: 12px;">🔑</div>
        <h1>Creator Login</h1>
        <p>Enter your email to receive a magic sign-in link.</p>
      </div>

      <div id="login-alert" class="form-alert"></div>

      <form id="creator-login-form" style="display: flex; flex-direction: column; gap: 20px;">
        <div class="field">
          <label for="login-email">Email Address *</label>
          <input type="email" id="login-email" required placeholder="name@email.com">
        </div>

        <button type="submit" class="neon-button" style="width: 100%; padding: 12px; font-size: 15px;">
          Send Login Link &rarr;
        </button>

        <p style="text-align: center; font-size: 14px; margin-top: 10px; color: var(--text-secondary);">
          New here? <a href="signup.html" style="color: var(--accent-cyan); text-decoration: underline;">Apply to join</a>
        </p>
      </form>
    </div>
  </main>

  <div data-site-footer></div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/global.js"></script><script src="../js/fx.js"></script>
  <script src="./js/auth.js"></script>
  
  <script>
    const form = document.getElementById("creator-login-form");
    const alertBox = document.getElementById("login-alert");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      alertBox.className = "form-alert";
      alertBox.style.display = "none";

      const email = document.getElementById("login-email").value.trim();
      const submitBtn = form.querySelector("button[type='submit']");
      
      submitBtn.disabled = true;
      submitBtn.textContent = "Sending link...";

      try {
        if (!supabase) {
          throw new Error("Supabase has not been loaded correctly.");
        }

        // Trigger Magic Link email
        const { error } = await supabase.auth.signInWithOtp({
          email: email,
          options: {
            emailRedirectTo: window.location.origin + '/influencer/dashboard.html'
          }
        });

        if (error) throw error;

        // Show success message
        alertBox.innerHTML = `
          <strong>Check your email!</strong><br>
          We have sent a magic login link to <strong>${email}</strong>. Click it to access your dashboard.
        `;
        alertBox.className = "form-alert success";
        form.reset();
        
        // Hide form fields
        form.style.display = "none";

      } catch (err) {
        console.error("Login error:", err);
        alertBox.textContent = err.message || "Failed to trigger login. Please check your email and try again.";
        alertBox.className = "form-alert error";
        submitBtn.disabled = false;
        submitBtn.textContent = "Send Login Link →";
      }
    });
  </script>
</body>
</html>
